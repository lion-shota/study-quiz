<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>理科 第6回〜第10回 クイズ（全100問）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: M PLUS Rounded 1c & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Inter', sans-serif;
            background-color: #f0f7ff;
            background-image: radial-gradient(#dbeafe 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* ルビが重ならず、かつ縦幅を取りすぎないコンパクト行間設定 */
        ruby {
            ruby-align: center;
        }
        rt {
            font-size: 0.55em;
            font-weight: 700;
            color: #475569;
            line-height: 1.0;
        }
        .ruby-question {
            line-height: 1.78 !important;
        }
        .ruby-choice {
            line-height: 1.72 !important;
        }
        .ruby-explanation {
            line-height: 1.82 !important;
        }
        .ruby-ui {
            line-height: 1.55 !important;
        }
        .quiz-card {
            box-shadow: 0 6px 18px -4px rgba(59, 130, 246, 0.14), 0 4px 8px -4px rgba(59, 130, 246, 0.08);
        }
        .choice-btn {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .choice-btn:active:not(:disabled) {
            transform: scale(0.985);
        }
        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            70% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.22s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between pb-3">

    <!-- 超コンパクト・ヘッダー＆操作バー（LINE内ブラウザ対応） -->
    <header class="bg-white/95 backdrop-blur-md border-b border-blue-100 sticky top-0 z-30 shadow-2xs">
        <div class="max-w-3xl mx-auto px-2 sm:px-4 py-1.5 sm:py-2.5">
            <!-- 1段目：タイトル＋成績バッジを横並び1行に凝縮 -->
            <div class="flex items-center justify-between gap-1.5">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="text-lg sm:text-2xl shrink-0">🔬</span>
                    <h1 class="text-xs sm:text-lg font-extrabold text-blue-700 tracking-tight truncate ruby-ui">
                        <span class="inline-block bg-blue-600 text-white text-[10px] sm:text-xs px-1.5 py-0.5 rounded-md mr-1 align-middle"><ruby>理科<rt>りか</rt></ruby> 第6回〜第10回</span>クイズ
                    </h1>
                </div>
                
                <!-- 成績バッジ（コンパクト） -->
                <div class="flex items-center gap-1 text-[11px] sm:text-xs font-extrabold shrink-0">
                    <div class="bg-amber-50 border border-amber-200 text-amber-700 px-1.5 sm:px-2.5 py-0.5 rounded-full flex items-center gap-0.5" title="連続正解数">
                        <span>🔥</span><span id="combo-count">0</span>
                    </div>
                    <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-1.5 sm:px-2.5 py-0.5 rounded-full flex items-center gap-0.5" title="正答率">
                        <span>🎯</span><span id="accuracy-rate">--%</span>
                    </div>
                    <div class="bg-blue-50 border border-blue-200 text-blue-700 px-1.5 sm:px-2.5 py-0.5 rounded-full flex items-center gap-0.5" title="解いた問題数">
                        <span>📝</span><span id="total-answered">0</span>
                    </div>
                </div>
            </div>

            <!-- 2段目：出題範囲プルダウン＋復習ボタンを横並び1行に配置 -->
            <div class="mt-1.5 pt-1.5 border-t border-slate-100 flex items-center justify-between gap-1.5">
                <select id="filter-select" aria-label="出題範囲" class="bg-slate-50 border border-slate-200 text-slate-700 text-[11px] sm:text-sm font-bold rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-0 cursor-pointer">
                    <option value="ALL">🌟 すべてランダム（全100問）</option>
                    <optgroup label="📚 単元（回）ごとにチャレンジ">
                        <option value="ROUND_6">🕊️ 第6回 羽のある動物（20問）</option>
                        <option value="ROUND_7">🦎 第7回 毛も羽もない動物（20問）</option>
                        <option value="ROUND_8">🦴 第8回 人体の不思議（20問）</option>
                        <option value="ROUND_9">🪞 第9回 鏡で光を集めよう（20問）</option>
                        <option value="ROUND_10">🔊 第10回 音の高さを変えてみよう（20問）</option>
                    </optgroup>
                    <optgroup label="🍂 テーマ別にチャレンジ">
                        <option value="SEASON">🍁 季節の移り変わり（紅葉・種子・地下の養分・冬の天気）</option>
                    </optgroup>
                </select>

                <!-- コンパクト復習モードボタン -->
                <button id="review-mode-btn" onclick="toggleReviewMode()" class="text-[11px] sm:text-xs font-extrabold px-2.5 py-1 rounded-lg border transition-all flex items-center justify-center gap-1 bg-white border-rose-200 text-rose-600 hover:bg-rose-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer shrink-0">
                    <span>💪</span>
                    <span id="review-btn-text" class="ruby-ui"><ruby>復習<rt>ふくしゅう</rt></ruby>(0問)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインクイズエリア（外枠余白を極限までスリム化） -->
    <main class="max-w-3xl w-full mx-auto px-1.5 sm:px-4 mt-1.5 sm:mt-4 flex-1 flex flex-col">
        
        <!-- 復習モード通知バー -->
        <div id="mode-banner" class="hidden mb-1.5 bg-rose-500 text-white text-[11px] sm:text-sm font-bold px-3 py-1.5 rounded-xl shadow-2xs flex items-center justify-between animate-pop">
            <div class="flex items-center gap-1.5">
                <span>🔥 にがて<ruby>復習<rt>ふくしゅう</rt></ruby>モード中</span>
                <span id="review-remaining" class="bg-white/20 px-2 py-0.5 rounded-full text-[10px] sm:text-xs">のこり 0 問</span>
            </div>
            <button onclick="exitReviewMode()" class="underline hover:text-rose-100 text-[11px] sm:text-xs cursor-pointer">もどる</button>
        </div>

        <!-- クイズカード -->
        <div class="bg-white rounded-2xl sm:rounded-3xl p-2.5 sm:p-6 quiz-card border border-blue-50 flex-1 flex flex-col justify-between">
            <div>
                <!-- 問題メタ情報（1行コンパクト） -->
                <div class="flex items-center justify-between gap-1.5 mb-1.5 sm:mb-3">
                    <div class="flex items-center gap-1 sm:gap-1.5 flex-wrap">
                        <span id="q-round-badge" class="bg-indigo-100 text-indigo-700 text-[10px] sm:text-xs font-extrabold px-2 py-0.5 rounded-full">
                            第6回
                        </span>
                        <span id="q-unit-badge" class="bg-blue-600 text-white text-[11px] sm:text-xs font-extrabold px-2.5 py-0.5 rounded-full">
                            羽のある動物
                        </span>
                        <span id="q-category-badge" class="bg-sky-100 text-sky-700 text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full">
                            渡り鳥
                        </span>
                    </div>
                    <span id="q-streak-badge" class="hidden text-[10px] sm:text-xs font-extrabold text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full shrink-0">
                        🔥 絶好調！
                    </span>
                </div>

                <!-- 問題文（1画面に収まる適度な高さとサイズ） -->
                <div class="min-h-[3.5rem] sm:min-h-[5.5rem] flex items-center mb-2 sm:mb-5">
                    <h2 id="question-text" class="text-[14px] sm:text-xl font-extrabold text-slate-800 ruby-question">
                        <ruby>問題<rt>もんだい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みこんでいます...
                    </h2>
                </div>

                <!-- 4択ボタン一覧（縦幅を詰めたスリム設計） -->
                <div id="choices-container" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 sm:gap-3">
                    <!-- JSで動的に生成 -->
                </div>
            </div>

            <!-- 判定＆解説エリア（回答後に表示） -->
            <div id="feedback-area" class="hidden mt-3 sm:mt-5 pt-2.5 sm:pt-4 border-t-2 border-dashed border-slate-200 animate-pop">
                <div id="result-header" class="flex items-center gap-2 mb-1.5">
                    <span id="result-icon" class="text-2xl sm:text-3xl">⭕</span>
                    <div>
                        <p id="result-title" class="text-base sm:text-xl font-extrabold">せいかい！</p>
                        <p id="correct-answer-sub" class="text-xs sm:text-sm font-bold text-slate-600 mt-0.5 hidden ruby-choice"></p>
                    </div>
                </div>

                <!-- テキストの豆知識・解説ボックス -->
                <div class="bg-amber-50/90 border border-amber-200 rounded-xl p-2.5 sm:p-3.5 mt-1.5">
                    <div class="flex items-center gap-1 text-amber-800 font-extrabold text-[11px] sm:text-xs mb-1">
                        <span>💡</span>
                        <span>ポイント・<ruby>豆知識<rt>まめちしき</rt></ruby></span>
                    </div>
                    <p id="explanation-text" class="text-xs sm:text-sm text-slate-700 font-medium ruby-explanation">
                        解説テキストがここに入ります。
                    </p>
                </div>

                <!-- 次の問題へボタン -->
                <button id="next-btn" onclick="nextQuestion()" class="mt-3 sm:mt-4 w-full bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-700 hover:to-sky-600 text-white font-extrabold text-sm sm:text-base py-2.5 sm:py-3.5 px-4 rounded-xl shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                    <span>つぎの<ruby>問題<rt>もんだい</rt></ruby>へ</span>
                    <span class="text-base sm:text-lg">➡️</span>
                </button>
            </div>
        </div>
    </main>

    <!-- コンパクトフッター -->
    <footer class="max-w-3xl w-full mx-auto px-2 sm:px-4 mt-2 flex items-center justify-between text-[10px] sm:text-xs text-slate-400">
        <p class="hidden sm:block">⌨️ キーボード：[1]〜[4]で選択 / [Enter]でつぎへ</p>
        <p class="sm:hidden">全20ページ・全100問収録</p>
        <button onclick="resetStats()" class="hover:text-slate-600 underline cursor-pointer"><ruby>成績<rt>せいせき</rt></ruby>リセット</button>
    </footer>

    <!-- リセット確認用カスタムモーダル -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 max-w-xs w-full shadow-2xl animate-pop">
            <h3 class="text-base font-extrabold text-slate-800 mb-1.5"><ruby>成績<rt>せいせき</rt></ruby>をリセットしますか？</h3>
            <p class="text-xs text-slate-600 mb-4 leading-relaxed">これまでのせいかい数や<ruby>連続<rt>れんぞく</rt></ruby>きろく、まちがえた<ruby>問題<rt>もんだい</rt></ruby>リストがすべて0にもどります。</p>
            <div class="flex gap-2.5">
                <button onclick="closeResetModal()" class="flex-1 py-2 px-3 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50 cursor-pointer">やめる</button>
                <button onclick="confirmReset()" class="flex-1 py-2 px-3 rounded-xl bg-rose-500 text-xs font-bold text-white hover:bg-rose-600 cursor-pointer">リセット</button>
            </div>
        </div>
    </div>

                category: "<ruby>モノコード<rt>モノコード</rt></ruby>の<ruby>実験<rt>じっけん</rt></ruby>",
                isSeason: false,
                question: "1本の弦を張った実験道具（モノコード）で、弦をおさえる位置を変えて振動する部分を「半分」の長さにすると、音はどうなるでしょう？",
                choices: [
                    "1オクターブ<ruby>高<rt>たか</rt></ruby>い音になる（振動数が2倍になる）",
                    "1オクターブ<ruby>低<rt>ひく</rt></ruby>い音になる",
                    "音の高さはまったく変わらない",
                    "音がまったく出なくなる"
                ],
                answerIndex: 0,
                explanation: "振動する弦の長さを半分にすると、1秒間に振動する回数が2倍になり、1オクターブ高い音が出ます。"
            },
            {
                id: "sci10_18",
                round: "ROUND_10",
                roundLabel: "第10回",
                unit: "<ruby>音<rt>おと</rt></ruby>の<ruby>高<rt>たか</rt></ruby>さを<ruby>変<rt>か</rt></ruby>えてみよう",
                category: "<ruby>音<rt>おと</rt></ruby>の<ruby>速<rt>はや</rt></ruby>さ",
                isSeason: false,
                question: "花火が光ってから少し遅れて「ドン！」と音が聞こえたり、稲光が見えてから少し遅れて雷の音が聞こえたりするのはなぜでしょう？",
                choices: [
                    "<ruby>光<rt>ひかり</rt></ruby>の進む速さよりも、<ruby>音<rt>おと</rt></ruby>が空気中を進む速さの方がずっと遅いから",
                    "花火や雷は、光ってから3秒後に音を出す仕組みになっているから",
                    "目よりも耳の方が遠い場所についているから",
                    "音は地面の下を遠回りして伝わってくるから"
                ],
                answerIndex: 0,
                explanation: "光は1秒間に約30万km進みますが、音は空気中を1秒間に約340mしか進まないため、遠くで起きた出来事は光が先に届き、音が遅れて聞こえます。"
            },
            {
                id: "sci10_19",
                round: "ROUND_10",
                roundLabel: "第10回",
                unit: "<ruby>音<rt>おと</rt></ruby>の<ruby>高<rt>たか</rt></ruby>さを<ruby>変<rt>か</rt></ruby>えてみよう",
                category: "<ruby>季節<rt>きせつ</rt></ruby>の<ruby>天気<rt>てんき</rt></ruby>",
                isSeason: true,
                question: "冬の人工衛星の雲写真を見ると、冷たい北西の季節風が暖かい日本海の上を通ることで、日本海側にどのような形の雲がたくさん発生しているでしょう？",
                choices: [
                    "<ruby>すじ状<rt>すじじょう</rt></ruby>の<ruby>雲<rt>くも</rt></ruby>",
                    "ドーナツ型の1つの巨大な雲",
                    "ハート型のピンク色の雲",
                    "雲が1つもない完全な快晴"
                ],
                answerIndex: 0,
                explanation: "冬になると大陸からの冷たい風が日本海から水蒸気をもらい、日本海側にたくさんの「すじ状の雲」ができて大雪を降らせます。"
            },
            {
                id: "sci10_20",
                round: "ROUND_10",
                roundLabel: "第10回",
                unit: "<ruby>音<rt>おと</rt></ruby>の<ruby>高<rt>たか</rt></ruby>さを<ruby>変<rt>か</rt></ruby>えてみよう",
                category: "<ruby>試験管<rt>しけんかん</rt></ruby>と<ruby>音<rt>おと</rt></ruby>",
                isSeason: false,
                question: "水の入った試験管の口に息を吹きかけて音を出すとき、「水がたくさん入っている試験管」と「水が少ししか入っていない試験管」では、どちらが高い音になるでしょう？",
                choices: [
                    "水が<ruby>たくさん<rt>たくさん</rt></ruby>入っている試験管（振動する空気の柱が短いから）",
                    "水が<ruby>少<rt>すこ</rt></ruby>ししか入っていない試験管（振動する空気の柱が長いから）",
                    "どちらもまったく同じ高さの音になる",
                    "息を吹きかけても試験管からは音が出ない"
                ],
                answerIndex: 0,
                explanation: "息を吹きかけるときは試験管の中の「空気の柱」が振動するため、水が多くて空気の部分が短い試験管ほど高い音になります（逆にたたいて鳴らすときはガラスと水が振動するため、水が多いほど低い音になります）。"
            }
        ];

        // ==========================================
        // アプリの状態管理（localStorage連携）
        // ==========================================
        const STORAGE_KEY_WRONG = 'science_quiz_6_10_wrong';
        const STORAGE_KEY_STATS = 'science_quiz_6_10_stats';

        let state = {
            selectedFilter: "ALL",
            isReviewMode: false,
            currentQuestion: null,
            currentChoices: [],
            lastQuestionId: null,
            answeredCount: 0,
            correctCount: 0,
            combo: 0,
            wrongQuestionIds: new Set(),
            isAnswered: false
        };

        // localStorageから読み込み
        function loadSavedState() {
            try {
                const rawWrong = localStorage.getItem(STORAGE_KEY_WRONG);
                if (rawWrong) {
                    const parsedWrong = JSON.parse(rawWrong);
                    if (Array.isArray(parsedWrong)) {
                        const validIds = new Set(quizDatabase.map(q => q.id));
                        state.wrongQuestionIds = new Set(parsedWrong.filter(id => validIds.has(id)));
                    }
                }
                const rawStats = localStorage.getItem(STORAGE_KEY_STATS);
                if (rawStats) {
                    const parsedStats = JSON.parse(rawStats);
                    if (typeof parsedStats.answeredCount === 'number') state.answeredCount = parsedStats.answeredCount;
                    if (typeof parsedStats.correctCount === 'number') state.correctCount = parsedStats.correctCount;
                    if (typeof parsedStats.combo === 'number') state.combo = parsedStats.combo;
                }
            } catch (e) {
                console.warn('保存データの読み込みに失敗しました', e);
            }
        }

        // localStorageへ保存
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY_WRONG, JSON.stringify(Array.from(state.wrongQuestionIds)));
                localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify({
                    answeredCount: state.answeredCount,
                    correctCount: state.correctCount,
                    combo: state.combo
                }));
            } catch (e) {
                console.warn('データの保存に失敗しました', e);
            }
        }

        // DOM要素の参照
        const els = {
            filterSelect: document.getElementById('filter-select'),
            reviewModeBtn: document.getElementById('review-mode-btn'),
            reviewBtnText: document.getElementById('review-btn-text'),
            modeBanner: document.getElementById('mode-banner'),
            reviewRemaining: document.getElementById('review-remaining'),
            qRoundBadge: document.getElementById('q-round-badge'),
            qUnitBadge: document.getElementById('q-unit-badge'),
            qCategoryBadge: document.getElementById('q-category-badge'),
            qStreakBadge: document.getElementById('q-streak-badge'),
            questionText: document.getElementById('question-text'),
            choicesContainer: document.getElementById('choices-container'),
            feedbackArea: document.getElementById('feedback-area'),
            resultIcon: document.getElementById('result-icon'),
            resultTitle: document.getElementById('result-title'),
            correctAnswerSub: document.getElementById('correct-answer-sub'),
            explanationText: document.getElementById('explanation-text'),
            comboCount: document.getElementById('combo-count'),
            accuracyRate: document.getElementById('accuracy-rate'),
            totalAnswered: document.getElementById('total-answered'),
            resetModal: document.getElementById('reset-modal')
        };

        // 配列をシャッフルする関数（Fisher-Yates）
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 初期化処理
        function init() {
            loadSavedState();

            const allOption = els.filterSelect.querySelector('option[value="ALL"]');
            if (allOption) {
                allOption.textContent = `🌟 すべてランダム（全${quizDatabase.length}問）`;
            }

            els.filterSelect.addEventListener('change', (e) => {
                state.selectedFilter = e.target.value;
                if (state.isReviewMode) {
                    exitReviewMode(false);
                }
                nextQuestion();
            });

            // キーボードショートカット対応
            document.addEventListener('keydown', (e) => {
                if (!els.resetModal.classList.contains('hidden')) return;

                if (!state.isAnswered) {
                    if (['1', '2', '3', '4'].includes(e.key)) {
                        const idx = parseInt(e.key, 10) - 1;
                        const buttons = els.choicesContainer.querySelectorAll('button');
                        if (buttons[idx]) {
                            buttons[idx].click();
                        }
                    }
                } else {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        nextQuestion();
                    }
                }
            });

            updateStatsUI();
            updateReviewUI();
            nextQuestion();
        }

        // 現在のフィルターに応じた出題プールを取得
        function getQuestionPool() {
            if (state.isReviewMode) {
                return quizDatabase.filter(q => state.wrongQuestionIds.has(q.id));
            }
            if (state.selectedFilter === "ALL") {
                return quizDatabase;
            }
            if (state.selectedFilter === "SEASON") {
                return quizDatabase.filter(q => q.isSeason);
            }
            return quizDatabase.filter(q => q.round === state.selectedFilter);
        }

        // 次の問題を出題
        function nextQuestion() {
            state.isAnswered = false;
            els.feedbackArea.classList.add('hidden');
            els.correctAnswerSub.classList.add('hidden');

            let pool = getQuestionPool();

            // 復習モードで全問クリアした場合
            if (state.isReviewMode && pool.length === 0) {
                exitReviewMode(true);
                return;
            }

            // 直前と同じ問題が連続しないようにフィルタ
            if (pool.length > 1 && state.lastQuestionId) {
                pool = pool.filter(q => q.id !== state.lastQuestionId);
            }

            // ランダムに1問選択
            const randomIndex = Math.floor(Math.random() * pool.length);
            const question = pool[randomIndex];
            state.currentQuestion = question;
            state.lastQuestionId = question.id;

            // メタバッジ・問題文を反映
            els.qRoundBadge.textContent = question.roundLabel;
            els.qUnitBadge.innerHTML = question.unit;
            els.qCategoryBadge.innerHTML = question.category;
            els.questionText.innerHTML = question.question;

            if (state.combo >= 3) {
                els.qStreakBadge.innerHTML = `🔥 ${state.combo}<ruby>連続<rt>れんぞく</rt></ruby>せいかい！`;
                els.qStreakBadge.classList.remove('hidden');
            } else {
                els.qStreakBadge.classList.add('hidden');
            }

            // 選択肢をシャッフルして描画（縦幅を抑えたスリムデザイン）
            const choiceObjs = question.choices.map((htmlStr, idx) => ({
                html: htmlStr,
                isCorrect: idx === question.answerIndex
            }));
            state.currentChoices = shuffleArray(choiceObjs);

            els.choicesContainer.innerHTML = '';
            const labels = ['ア', 'イ', 'ウ', 'エ'];

            state.currentChoices.forEach((choiceObj, idx) => {
                const btn = document.createElement('button');
                btn.className = "choice-btn w-full text-left bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-xl px-2.5 py-2 sm:p-3.5 font-bold text-slate-800 text-[13px] sm:text-base flex items-center gap-2 sm:gap-3 shadow-2xs cursor-pointer";
                btn.innerHTML = `
                    <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-white border border-slate-300 text-blue-600 font-extrabold text-xs sm:text-sm flex items-center justify-center shrink-0">
                        ${labels[idx]}
                    </span>
                    <span class="ruby-choice">${choiceObj.html}</span>
                `;
                btn.onclick = () => handleAnswer(idx, btn);
                els.choicesContainer.appendChild(btn);
            });

            updateReviewUI();

            // 次の問題に切り替わったら上部へスムーズスクロール
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 回答選択時の処理
        function handleAnswer(selectedIdx, clickedBtn) {
            if (state.isAnswered) return;
            state.isAnswered = true;

            const q = state.currentQuestion;
            const selectedChoiceObj = state.currentChoices[selectedIdx];
            const isCorrect = selectedChoiceObj.isCorrect;
            state.answeredCount++;

            const buttons = els.choicesContainer.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-400', 'cursor-pointer');
                const isThisCorrect = state.currentChoices[idx].isCorrect;

                if (isThisCorrect) {
                    btn.classList.remove('bg-slate-50', 'border-slate-200');
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'ring-2', 'ring-emerald-200');
                    btn.querySelector('span:first-child').classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                } else if (btn === clickedBtn && !isCorrect) {
                    btn.classList.remove('bg-slate-50', 'border-slate-200');
                    btn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
                    btn.querySelector('span:first-child').classList.add('bg-rose-500', 'text-white', 'border-rose-500');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            if (isCorrect) {
                state.correctCount++;
                state.combo++;
                if (state.wrongQuestionIds.has(q.id)) {
                    state.wrongQuestionIds.delete(q.id);
                }

                els.resultIcon.textContent = "⭕";
                els.resultTitle.innerHTML = getPraiseMessage(state.combo);
                els.resultTitle.className = "text-base sm:text-xl font-extrabold text-emerald-600 ruby-ui";

                if (state.combo > 0 && state.combo % 5 === 0) {
                    fireConfetti();
                }
            } else {
                state.combo = 0;
                state.wrongQuestionIds.add(q.id);

                const correctHtml = q.choices[q.answerIndex];
                els.resultIcon.textContent = "❌";
                els.resultTitle.textContent = "ざんねん… もうひと息！";
                els.resultTitle.className = "text-base sm:text-xl font-extrabold text-rose-600";
                els.correctAnswerSub.innerHTML = `<ruby>正解<rt>せいかい</rt></ruby>は「<span class="text-emerald-700 underline decoration-emerald-400 decoration-2">${correctHtml}</span>」だよ`;
                els.correctAnswerSub.classList.remove('hidden');
            }

            els.explanationText.innerHTML = q.explanation;
            els.feedbackArea.classList.remove('hidden');

            saveState();
            updateStatsUI();
            updateReviewUI();

            setTimeout(() => {
                els.feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 80);
        }

        // 連続正解数に応じたほめ言葉
        function getPraiseMessage(combo) {
            if (combo >= 10) return `神レベル！${combo}<ruby>連続<rt>れんぞく</rt></ruby>せいかい！！`;
            if (combo >= 5) return `すごい！${combo}<ruby>連続<rt>れんぞく</rt></ruby>せいかい<ruby>達成<rt>たっせい</rt></ruby>！`;
            if (combo >= 3) return `<ruby>絶好調<rt>ぜっこうちょう</rt></ruby>！${combo}<ruby>連続<rt>れんぞく</rt></ruby>せいかい！`;
            return "せいかい！その<ruby>調子<rt>ちょうし</rt></ruby>！";
        }

        // 紙吹雪エフェクト
        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 65,
                    spread: 55,
                    origin: { y: 0.7 }
                });
            }
        }

        // ステータスバーの更新
        function updateStatsUI() {
            els.comboCount.textContent = state.combo;
            els.totalAnswered.textContent = state.answeredCount;

            if (state.answeredCount === 0) {
                els.accuracyRate.textContent = "--%";
            } else {
                const rate = Math.round((state.correctCount / state.answeredCount) * 100);
                els.accuracyRate.textContent = `${rate}%`;
            }
        }

        // 復習ボタン・バナーの表示更新
        function updateReviewUI() {
            const count = state.wrongQuestionIds.size;
            els.reviewBtnText.innerHTML = `<ruby>復習<rt>ふくしゅう</rt></ruby>(${count}問)`;
            els.reviewModeBtn.disabled = (count === 0 && !state.isReviewMode);

            if (state.isReviewMode) {
                els.modeBanner.classList.remove('hidden');
                els.reviewRemaining.textContent = `のこり ${count} 問`;
                els.reviewModeBtn.classList.add('bg-rose-500', 'text-white', 'border-rose-500');
                els.reviewModeBtn.classList.remove('bg-white', 'text-rose-600');
            } else {
                els.modeBanner.classList.add('hidden');
                els.reviewModeBtn.classList.remove('bg-rose-500', 'text-white', 'border-rose-500');
                els.reviewModeBtn.classList.add('bg-white', 'text-rose-600');
            }
        }

        // 復習モードの切り替え
        function toggleReviewMode() {
            if (state.isReviewMode) {
                exitReviewMode(true);
            } else {
                if (state.wrongQuestionIds.size === 0) return;
                state.isReviewMode = true;
                updateReviewUI();
                nextQuestion();
            }
        }

        // 復習モード終了
        function exitReviewMode(shouldLoadNext = true) {
            state.isReviewMode = false;
            updateReviewUI();
            if (shouldLoadNext) {
                nextQuestion();
            }
        }

        // リセットモーダル制御
        function resetStats() {
            els.resetModal.classList.remove('hidden');
        }
        function closeResetModal() {
            els.resetModal.classList.add('hidden');
        }
        function confirmReset() {
            state.answeredCount = 0;
            state.correctCount = 0;
            state.combo = 0;
            state.wrongQuestionIds.clear();
            state.isReviewMode = false;
            saveState();
            closeResetModal();
            updateStatsUI();
            updateReviewUI();
            nextQuestion();
        }

        // 起動
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
